name: Datos quinielas

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,22 * * *"
  push:
    paths: [scripts/build_quinielas.py]

permissions:
  contents: write

jobs:
  quinielas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          if [ -f scripts/build_quinielas.py ]; then python3 scripts/build_quinielas.py; else python3 scripts/probe_quiniela.py; fi
      - name: Guardar
        run: |
          git add data quinielas/src/main/assets || true
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Datos: quinielas"
            git pull --rebase && git push
          fi
