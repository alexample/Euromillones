name: Datos GeoLotería

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar contorno de España y núcleos urbanos
        run: python3 scripts/build_geo_data.py
      - name: Guardar
        run: |
          git add geo/src/main/assets/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "GeoLotería: datos de España y núcleos urbanos"
            git push
          fi
