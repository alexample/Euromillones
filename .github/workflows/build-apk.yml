name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Euromillones.apk

      - uses: actions/upload-artifact@v4
        with:
          name: euromillones-apk
          path: Euromillones.apk

      - name: Publicar en Releases (descarga directa desde el móvil)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Euromillones (última versión)
          make_latest: true
          files: Euromillones.apk
