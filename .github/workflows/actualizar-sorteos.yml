name: Actualizar sorteos

on:
  schedule:
    # Martes y viernes tras el sorteo (hora UTC) y repaso a la mañana siguiente
    - cron: "40 21 * * 2,5"
    - cron: "17 23 * * 2,5"
    - cron: "23 7 * * 3,6"
  workflow_dispatch:
    inputs:
      full:
        description: "Volver a descargar todo el histórico"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-sorteos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar resultados
        run: python3 scripts/update_draws.py ${{ inputs.full && '--full' || '' }}

      - name: Guardar cambios
        run: |
          git add data/draws.json
          if git diff --cached --quiet; then
            echo "Sin sorteos nuevos"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sorteos actualizados $(date -u +%Y-%m-%d)"
            git push
          fi
