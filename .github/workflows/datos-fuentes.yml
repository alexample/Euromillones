name: Datos fuentes

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/datos-fuentes.yml]

permissions:
  contents: write

jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fuentes libres (Google Fonts, licencias OFL/Apache)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          D = "quinielas/src/main/res/font"; os.makedirs(D, exist_ok=True)
          H = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "User-Agent": "x"}
          want = {"maquina": ("apache/specialelite", "ofl/specialelite"), "imprenta": ("ofl/fjallaone",),
                  "estrecha": ("ofl/pragatinarrow",), "lapiz": ("ofl/reeniebeanie", "apache/reeniebeanie")}
          for name, dirs in want.items():
              ok = False
              for d in dirs:
                  try:
                      r = urllib.request.urlopen(urllib.request.Request("https://api.github.com/repos/google/fonts/contents/" + d, headers=H))
                      files = [f for f in json.load(r) if f["name"].lower().endswith(".ttf")]
                  except Exception as e:
                      print(d, "ERROR", e); continue
                  print(d, [f["name"] for f in files])
                  files.sort(key=lambda f: (("Bold" in f["name"]) or ("[" in f["name"]), len(f["name"])))
                  for f in files[:1]:
                      urllib.request.urlretrieve(f["download_url"], f"{D}/{name}.ttf"); ok = True
                  bold = [f for f in files if f["name"].endswith("-Bold.ttf")]
                  if name == "estrecha" and bold: urllib.request.urlretrieve(bold[0]["download_url"], f"{D}/estrecha_negrita.ttf")
                  if ok: break
              print(name, "OK" if ok else "NO ENCONTRADA")
          PY
          ls -la quinielas/src/main/res/font
      - name: Guardar
        run: |
          git add quinielas/src/main/res/font
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Fuentes para la app Quinielas (Special Elite, Fjalla One, Pragati Narrow, Reenie Beanie)"
            git pull --rebase && git push
          fi
