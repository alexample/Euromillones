name: Diagnostico diccionario
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cd /tmp && npm pack dictionary-es@latest >/dev/null 2>&1 && tar xzf dictionary-es-*.tgz
          ls -la package; grep -E '"(license|version)"' package/package.json
          python3 - <<'P'
          import re,random,io
          raw=open('/tmp/package/index.dic',encoding='utf-8',errors='replace').read().splitlines()
          print('lineas',len(raw), raw[:3])
          w=set()
          for l in raw[1:]:
              x=l.split('/')[0].strip()
              if re.fullmatch(r'[a-záéíóúüñ]{3,15}',x): w.add(x)
          w=sorted(w); print('lemas',len(w)); random.seed(2); print(random.sample(w,60))
          P
