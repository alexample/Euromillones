name: Diagnostico eventos
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 30 -A "GeoLoteria/1.0 (github.com/alexample/Euromillones)" -o /tmp/e.json -w "HTTP %{http_code} size %{size_download}\n" https://es.wikipedia.org/api/rest_v1/feed/onthisday/all/03/14
          python3 - <<'P'
          import json
          d=json.load(open('/tmp/e.json'))
          for k,v in d.items(): print(k, len(v))
          for e in d.get('events',[])[:3]+d.get('selected',[])[:2]:
              print(e.get('year'), '|', e.get('text')[:150], '|', [(p.get('title'), p.get('content_urls',{}).get('desktop',{}).get('page')) for p in e.get('pages',[])][:3])
          P
